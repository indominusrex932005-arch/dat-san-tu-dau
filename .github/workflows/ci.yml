name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lay code
        uses: actions/checkout@v5

      - name: Cai Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Cai thu vien
        run: npm ci

      - name: Kiem tra JavaScript
        run: npm run lint