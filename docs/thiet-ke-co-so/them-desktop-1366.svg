<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1089" viewBox="0 0 1366 1089" role="img" aria-labelledby="title desc"><title id="title">Thêm cơ sở · 1366px</title><desc id="desc">Mẫu thiết kế tĩnh, chưa phải chức năng đang chạy. Ba trường: name, address bắt buộc; phone không bắt buộc.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1366" height="1089" rx="0" fill="#f7f8f2"/><rect x="0" y="96" width="1366" height="1" rx="0" fill="#dce2d5"/><rect x="93" y="27" width="42" height="42" rx="12" fill="#173f35"/><g transform="translate(99 33)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#e8edcf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="22" height="18" rx="2"/><path d="M16 7v18M5 12h5v8H5m22-8h-5v8h5"/><circle cx="16" cy="16" r="4"/></svg></g><text x="147" y="56.0" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#173f35">Sân Thể Thao</text><text x="1075" y="51.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Trang chủ</text><rect x="1171" y="26" width="76" height="40" rx="8" fill="#e8eddf"/><text x="1188" y="51.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Cơ sở</text><g transform="translate(93 132)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#173f35" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 16H6m8-8-8 8 8 8"/></svg></g><text x="119" y="145.7" font-size="13" font-weight="400" letter-spacing="0" fill="#173f35">Danh sách cơ sở</text><text x="93" y="203.9" font-size="11" font-weight="700" letter-spacing="1.4" fill="#597047">THÔNG TIN ĐỊA ĐIỂM</text><text x="93" y="267.0" font-size="50" font-weight="700" letter-spacing="-1" fill="#173f35">Thêm cơ sở</text><text x="93" y="302.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Bổ sung thông tin địa điểm kinh doanh.</text><rect x="93" y="358" width="712" height="571" rx="14" fill="#ffffff" stroke="#dce2d5"/><text x="125" y="401.7" font-size="13" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><text x="137" y="401.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">Trường bắt buộc</text><text x="125" y="442.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Tên cơ sở</text><text x="207" y="442.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="125" y="457" width="648" height="52" rx="8" fill="#ffffff" stroke="#7b887b" data-field="name"/><text x="139" y="488.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập tên cơ sở</text><text x="125" y="545.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Địa chỉ</text><text x="174" y="545.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="125" y="560" width="648" height="104" rx="8" fill="#ffffff" stroke="#7b887b" data-field="address"/><text x="139" y="591.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập địa chỉ cơ sở</text><rect x="760" y="654" width="5" height="1" rx="0" fill="#5c6c61"/><text x="125" y="700.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Số điện thoại</text><text x="225" y="699.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">(không bắt buộc)</text><rect x="125" y="715" width="648" height="52" rx="8" fill="#ffffff" stroke="#7b887b" data-field="phone"/><text x="139" y="746.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập số điện thoại</text><text x="125" y="787.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">Có thể để trống.</text><rect x="125" y="821" width="648" height="1" rx="0" fill="#dce2d5"/><rect x="125" y="845" width="116" height="52" rx="8" fill="#ffffff" stroke="#7b887b"/><text x="153" y="875.5" font-size="15" font-weight="700" letter-spacing="0" fill="#173f35">Quay lại</text><rect x="597" y="845" width="176" height="52" rx="8" fill="#173f35"/><text x="648.5" y="875.5" font-size="15" font-weight="700" letter-spacing="0" fill="#ffffff">Lưu cơ sở</text><rect x="845" y="358" width="300" height="258" rx="14" fill="#eef1e7" stroke="#dce2d5"/><rect x="869" y="382" width="44" height="44" rx="12" fill="#f7f8f2" stroke="#dce2d5"/><g transform="translate(879 390)"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#173f35" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 29S25 21 25 11a9 9 0 1 0-18 0c0 10 9 18 9 18Z"/><circle cx="16" cy="11" r="3"/></svg></g><text x="869" y="471.8" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#173f35">Thông tin rõ ràng,</text><text x="869" y="500.8" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#173f35">dễ tìm địa điểm.</text><text x="869" y="538.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">Mỗi cơ sở là một địa điểm kinh doanh.</text><text x="869" y="563.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">Tên và địa chỉ giúp mọi người</text><text x="869" y="584.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">nhận biết đúng cơ sở.</text><rect x="0" y="977" width="1366" height="112" rx="0" fill="#f7f8f2"/><rect x="0" y="977" width="1366" height="1" rx="0" fill="#dce2d5"/><text x="93" y="1015.4" font-size="16" font-weight="700" letter-spacing="0" fill="#173f35">Sân Thể Thao</text><text x="93" y="1036.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Hệ thống quản lý đặt sân thể thao</text><text x="976" y="1025.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">Kết nối đam mê. Cùng nhau vận động.</text></g></svg>