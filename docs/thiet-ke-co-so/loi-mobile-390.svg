<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1421" viewBox="0 0 390 1421" role="img" aria-labelledby="title desc"><title id="title">Sửa cơ sở — lỗi minh họa · 390px</title><desc id="desc">Mẫu thiết kế tĩnh, chưa phải chức năng đang chạy. Dữ liệu minh họa; tên để trống, địa chỉ và điện thoại được giữ lại.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="390" height="1421" rx="0" fill="#f7f8f2"/><rect x="0" y="132" width="390" height="1" rx="0" fill="#dce2d5"/><rect x="20" y="22" width="42" height="42" rx="12" fill="#173f35"/><g transform="translate(26 28)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#e8edcf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="22" height="18" rx="2"/><path d="M16 7v18M5 12h5v8H5m22-8h-5v8h5"/><circle cx="16" cy="16" r="4"/></svg></g><text x="74" y="49.1" font-size="19" font-weight="700" letter-spacing="-0.5" fill="#173f35">Sân Thể Thao</text><text x="35" y="105.7" font-size="13" font-weight="700" letter-spacing="0" fill="#173f35">Trang chủ</text><rect x="131" y="81" width="76" height="40" rx="8" fill="#e8eddf"/><text x="148" y="105.7" font-size="13" font-weight="700" letter-spacing="0" fill="#173f35">Cơ sở</text><g transform="translate(20 156)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#173f35" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 16H6m8-8-8 8 8 8"/></svg></g><text x="46" y="169.7" font-size="13" font-weight="400" letter-spacing="0" fill="#173f35">Danh sách cơ sở</text><text x="20" y="213.9" font-size="11" font-weight="700" letter-spacing="1.4" fill="#597047">THÔNG TIN ĐỊA ĐIỂM</text><text x="20" y="262.6" font-size="34" font-weight="700" letter-spacing="-1" fill="#173f35">Sửa cơ sở</text><text x="20" y="300.6" font-size="14" font-weight="400" letter-spacing="0" fill="#5c6c61">Cập nhật thông tin địa điểm kinh doanh.</text><text x="20" y="323.6" font-size="14" font-weight="400" letter-spacing="0" fill="#5c6c61">Cùng nhau xây dựng những điểm hẹn thể thao.</text><rect x="20" y="364" width="350" height="897" rx="14" fill="#ffffff" stroke="#dce2d5"/><rect x="40" y="384" width="310" height="48" rx="8" fill="#eef1e7"/><text x="52" y="402.8" font-size="12" font-weight="700" letter-spacing="0" fill="#173f35">Dữ liệu minh họa</text><text x="52" y="420.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Không phải thông tin cơ sở thật.</text><rect x="40" y="452" width="310" height="104" rx="8" fill="#fff5f3" stroke="#dcaca5"/><g transform="translate(54 467)"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="#a52f2f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><path d="M16 9v9m0 5h.01"/></svg></g><text x="84" y="481.5" font-size="15" font-weight="700" letter-spacing="0" fill="#a52f2f">Chưa thể lưu cơ sở</text><text x="54" y="509.7" font-size="13" font-weight="400" letter-spacing="0" fill="#a52f2f">Kiểm tra trường được đánh dấu</text><text x="54" y="530.7" font-size="13" font-weight="400" letter-spacing="0" fill="#a52f2f">bên dưới.</text><text x="40" y="591.7" font-size="13" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><text x="52" y="591.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">Trường bắt buộc</text><text x="40" y="632.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Tên cơ sở</text><text x="122" y="632.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="40" y="647" width="310" height="52" rx="8" fill="#ffffff" stroke="#a52f2f" data-field="name"/><text x="54" y="678.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập tên cơ sở</text><text x="40" y="719.8" font-size="12" font-weight="400" letter-spacing="0" fill="#a52f2f">Vui lòng nhập tên cơ sở.</text><text x="40" y="765.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Địa chỉ</text><text x="89" y="765.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="40" y="780" width="310" height="104" rx="8" fill="#ffffff" stroke="#7b887b" data-field="address"/><text x="54" y="810.4" font-size="16" font-weight="400" letter-spacing="0" fill="#173f35">Số 18 Đường Nội Bộ,</text><text x="54" y="836.4" font-size="16" font-weight="400" letter-spacing="0" fill="#173f35">Phường Mẫu</text><rect x="337" y="874" width="5" height="1" rx="0" fill="#5c6c61"/><text x="40" y="920.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Số điện thoại</text><text x="140" y="919.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">(không bắt buộc)</text><rect x="40" y="935" width="310" height="52" rx="8" fill="#ffffff" stroke="#7b887b" data-field="phone"/><text x="54" y="966.4" font-size="16" font-weight="400" letter-spacing="0" fill="#173f35">0123 456 789</text><text x="40" y="1007.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">Có thể để trống.</text><text x="40" y="1051.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">Thông tin bạn đã nhập</text><text x="40" y="1070.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">vẫn được giữ lại.</text><rect x="40" y="1101" width="310" height="1" rx="0" fill="#dce2d5"/><rect x="40" y="1125" width="310" height="52" rx="8" fill="#173f35"/><text x="146.0" y="1155.5" font-size="15" font-weight="700" letter-spacing="0" fill="#ffffff">Lưu thay đổi</text><rect x="40" y="1189" width="310" height="52" rx="8" fill="#ffffff" stroke="#7b887b"/><text x="165.0" y="1219.5" font-size="15" font-weight="700" letter-spacing="0" fill="#173f35">Quay lại</text><rect x="0" y="1309" width="390" height="112" rx="0" fill="#f7f8f2"/><rect x="0" y="1309" width="390" height="1" rx="0" fill="#dce2d5"/><text x="20" y="1347.4" font-size="16" font-weight="700" letter-spacing="0" fill="#173f35">Sân Thể Thao</text><text x="20" y="1368.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Hệ thống quản lý đặt sân thể thao</text><text x="20" y="1393.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Kết nối đam mê. Cùng nhau vận động.</text></g></svg>