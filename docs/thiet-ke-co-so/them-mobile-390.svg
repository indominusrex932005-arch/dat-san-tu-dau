<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1188" viewBox="0 0 390 1188" role="img" aria-labelledby="title desc"><title id="title">Thêm cơ sở · 390px</title><desc id="desc">Mẫu thiết kế tĩnh, chưa phải chức năng đang chạy. Ba trường: name, address bắt buộc; phone không bắt buộc.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="390" height="1188" rx="0" fill="#f7f8f2"/><rect x="0" y="132" width="390" height="1" rx="0" fill="#dce2d5"/><rect x="20" y="22" width="42" height="42" rx="12" fill="#173f35"/><g transform="translate(26 28)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#e8edcf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="22" height="18" rx="2"/><path d="M16 7v18M5 12h5v8H5m22-8h-5v8h5"/><circle cx="16" cy="16" r="4"/></svg></g><text x="74" y="49.1" font-size="19" font-weight="700" letter-spacing="-0.5" fill="#173f35">Sân Thể Thao</text><text x="35" y="105.7" font-size="13" font-weight="700" letter-spacing="0" fill="#173f35">Trang chủ</text><rect x="131" y="81" width="76" height="40" rx="8" fill="#e8eddf"/><text x="148" y="105.7" font-size="13" font-weight="700" letter-spacing="0" fill="#173f35">Cơ sở</text><g transform="translate(20 156)"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#173f35" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M26 16H6m8-8-8 8 8 8"/></svg></g><text x="46" y="169.7" font-size="13" font-weight="400" letter-spacing="0" fill="#173f35">Danh sách cơ sở</text><text x="20" y="213.9" font-size="11" font-weight="700" letter-spacing="1.4" fill="#597047">THÔNG TIN ĐỊA ĐIỂM</text><text x="20" y="262.6" font-size="34" font-weight="700" letter-spacing="-1" fill="#173f35">Thêm cơ sở</text><text x="20" y="300.6" font-size="14" font-weight="400" letter-spacing="0" fill="#5c6c61">Bổ sung thông tin địa điểm kinh doanh.</text><text x="20" y="323.6" font-size="14" font-weight="400" letter-spacing="0" fill="#5c6c61">Cùng nhau xây dựng những điểm hẹn thể thao.</text><rect x="20" y="364" width="350" height="611" rx="14" fill="#ffffff" stroke="#dce2d5"/><text x="40" y="395.7" font-size="13" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><text x="52" y="395.7" font-size="13" font-weight="400" letter-spacing="0" fill="#5c6c61">Trường bắt buộc</text><text x="40" y="436.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Tên cơ sở</text><text x="122" y="436.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="40" y="451" width="310" height="52" rx="8" fill="#ffffff" stroke="#7b887b" data-field="name"/><text x="54" y="482.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập tên cơ sở</text><text x="40" y="539.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Địa chỉ</text><text x="89" y="539.6" font-size="14" font-weight="700" letter-spacing="0" fill="#a52f2f">*</text><rect x="40" y="554" width="310" height="104" rx="8" fill="#ffffff" stroke="#7b887b" data-field="address"/><text x="54" y="585.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập địa chỉ cơ sở</text><rect x="337" y="648" width="5" height="1" rx="0" fill="#5c6c61"/><text x="40" y="694.6" font-size="14" font-weight="700" letter-spacing="0" fill="#173f35">Số điện thoại</text><text x="140" y="693.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">(không bắt buộc)</text><rect x="40" y="709" width="310" height="52" rx="8" fill="#ffffff" stroke="#7b887b" data-field="phone"/><text x="54" y="740.4" font-size="16" font-weight="400" letter-spacing="0" fill="#5c6c61">Nhập số điện thoại</text><text x="40" y="781.8" font-size="12" font-weight="400" letter-spacing="0" fill="#5c6c61">Có thể để trống.</text><rect x="40" y="815" width="310" height="1" rx="0" fill="#dce2d5"/><rect x="40" y="839" width="310" height="52" rx="8" fill="#173f35"/><text x="158.5" y="869.5" font-size="15" font-weight="700" letter-spacing="0" fill="#ffffff">Lưu cơ sở</text><rect x="40" y="903" width="310" height="52" rx="8" fill="#ffffff" stroke="#7b887b"/><text x="165.0" y="933.5" font-size="15" font-weight="700" letter-spacing="0" fill="#173f35">Quay lại</text><rect x="0" y="1076" width="390" height="112" rx="0" fill="#f7f8f2"/><rect x="0" y="1076" width="390" height="1" rx="0" fill="#dce2d5"/><text x="20" y="1114.4" font-size="16" font-weight="700" letter-spacing="0" fill="#173f35">Sân Thể Thao</text><text x="20" y="1135.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Hệ thống quản lý đặt sân thể thao</text><text x="20" y="1160.9" font-size="11" font-weight="400" letter-spacing="0" fill="#5c6c61">Kết nối đam mê. Cùng nhau vận động.</text></g></svg>