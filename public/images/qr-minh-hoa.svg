<svg xmlns="http://www.w3.org/2000/svg" width="240" height="270" viewBox="0 0 240 270" role="img" aria-labelledby="qrTitle qrDesc">
  <title id="qrTitle">Vị trí mã QR minh họa</title>
  <desc id="qrDesc">Hình vẽ mô tả màn thanh toán, không chứa mã ngân hàng và không thể dùng để thanh toán.</desc>
  <rect x="1" y="1" width="238" height="268" rx="15" fill="#fff" stroke="#c5d1bd" stroke-width="2"/>
  <g fill="#173f35" opacity=".24">
    <rect x="26" y="26" width="44" height="44" rx="8"/><rect x="87" y="26" width="18" height="18"/><rect x="122" y="26" width="34" height="18"/>
    <rect x="173" y="26" width="40" height="40" rx="8"/><rect x="89" y="57" width="32" height="18"/><rect x="138" y="60" width="18" height="32"/>
    <rect x="26" y="91" width="18" height="36"/><rect x="57" y="88" width="36" height="18"/><rect x="174" y="89" width="38" height="18"/>
    <rect x="27" y="148" width="42" height="42" rx="8"/><rect x="88" y="156" width="19" height="34"/><rect x="123" y="155" width="34" height="19"/>
    <rect x="173" y="146" width="18" height="44"/><rect x="204" y="135" width="10" height="55"/>
  </g>
  <rect x="16" y="103" width="208" height="45" rx="6" fill="#f0f4e9" stroke="#8fa478"/>
  <text x="120" y="132" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#173f35">QR MINH HỌA</text>
  <text x="120" y="221" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#812424">CHƯA THỂ THANH TOÁN</text>
  <text x="120" y="242" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#53685d">Chưa kết nối ngân hàng</text>
</svg>
